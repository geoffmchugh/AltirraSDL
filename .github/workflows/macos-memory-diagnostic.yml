name: macOS memory diagnostic

# Manual-only diagnostic for leaks that reproduce while the emulator is
# paused.  This deliberately launches the normal Cocoa .app executable;
# --headless would select SDL's offscreen driver and bypass the platform path
# that the reported macOS-only growth is most likely to involve.

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: Paused observation time
        required: true
        default: "10"
        type: choice
        options:
          - "5"
          - "10"
          - "20"
      malloc_stack_logging:
        description: Record malloc stacks (more diagnostic data, higher overhead)
        required: true
        default: true
        type: boolean
      publish_release:
        description: Replace the asset on memory-diagnostic-bad4452f
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  diagnose:
    name: Paused Cocoa run (${{ inputs.duration_minutes }} min)
    runs-on: macos-26
    timeout-minutes: 75
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/macos-debug/_deps
          key: macos-memory-deps-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'src/AltirraSDL/CMakeLists.txt') }}
          restore-keys: |
            macos-memory-deps-

      - name: Configure diagnostic build
        run: |
          cmake --preset macos-debug \
            -DALTIRRA_FETCH_SDL3=ON \
            -DALTIRRA_ENABLE_FFMPEG_RECORDING=OFF \
            -DALTIRRA_FETCH_FFMPEG=OFF \
            -DALTIRRA_MAC_OS_LEAK_DEBUG=ON

      - name: Build AltirraSDL
        run: |
          cmake --build --preset macos-debug \
            --target AltirraSDL \
            -j"$(sysctl -n hw.ncpu)"

      - name: Run paused memory diagnostic
        env:
          DIAG_DURATION_MINUTES: ${{ inputs.duration_minutes }}
          DIAG_MALLOC_STACKS: ${{ inputs.malloc_stack_logging }}
        run: |
          set -u

          DIAG_DIR="$RUNNER_TEMP/altirra-memory-diagnostic"
          APP_PATH="build/macos-debug/src/AltirraSDL/AltirraSDL.app"
          APP_BIN="$APP_PATH/Contents/MacOS/AltirraSDL"
          mkdir -p "$DIAG_DIR"

          if [ ! -x "$APP_BIN" ]; then
            echo "AltirraSDL executable not found at $APP_BIN" >&2
            find build/macos-debug -maxdepth 5 -type f -name AltirraSDL -print
            exit 1
          fi

          # Script transport avoids depending on nc/socat.  The command is
          # consumed on the main thread after startup and leaves the program
          # paused while its normal SDL/Cocoa/ImGui render loop continues.
          printf 'pause\n' > "$DIAG_DIR/testmode-script.txt"
          : > "$DIAG_DIR/testmode-output.jsonl"
          : > "$DIAG_DIR/app.log"
          printf 'elapsed_seconds,rss_kb,vsz_kb\n' > "$DIAG_DIR/memory.csv"

          export ALTIRRA_TESTMODE_SCRIPT="$DIAG_DIR/testmode-script.txt"
          export ALTIRRA_TESTMODE_OUTPUT="$DIAG_DIR/testmode-output.jsonl"
          export NSUnbufferedIO=YES

          # These Objective-C runtime diagnostics are central to this test:
          # an absent per-loop autorelease pool is a leading macOS-only
          # hypothesis.  Warnings go to app.log.
          export OBJC_DEBUG_MISSING_POOLS=YES
          export OBJC_PRINT_POOL_HIGHWATER=YES

          if [ "$DIAG_MALLOC_STACKS" = "true" ]; then
            export MallocStackLogging=1
          fi

          "$APP_BIN" --test-mode > "$DIAG_DIR/app.log" 2>&1 &
          app_pid=$!
          echo "$app_pid" > "$DIAG_DIR/pid.txt"

          cleanup() {
            if kill -0 "$app_pid" 2>/dev/null; then
              kill -TERM "$app_pid" 2>/dev/null || true
              for cleanup_try in 1 2 3 4 5; do
                kill -0 "$app_pid" 2>/dev/null || break
                sleep 1
              done
              kill -KILL "$app_pid" 2>/dev/null || true
            fi
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          # Wait for full initialization and for the scripted pause command.
          initialized=false
          for startup_try in $(seq 1 90); do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "AltirraSDL exited during startup" >&2
              tail -200 "$DIAG_DIR/app.log" || true
              exit 1
            fi
            if grep -q 'entering main loop' "$DIAG_DIR/app.log" \
                && grep -q 'Initialized with script transport only' "$DIAG_DIR/app.log"; then
              initialized=true
              break
            fi
            sleep 1
          done
          if [ "$initialized" != "true" ]; then
            echo "Timed out waiting for AltirraSDL initialization" >&2
            tail -200 "$DIAG_DIR/app.log" || true
            exit 1
          fi

          sleep 5
          vmmap -summary "$app_pid" > "$DIAG_DIR/vmmap-start.txt" 2>&1 || true
          footprint -p "$app_pid" > "$DIAG_DIR/footprint-start.txt" 2>&1 || true

          duration_seconds=$((DIAG_DURATION_MINUTES * 60))
          elapsed_seconds=0
          while [ "$elapsed_seconds" -le "$duration_seconds" ]; do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "AltirraSDL exited at ${elapsed_seconds}s" >&2
              break
            fi

            memory_values=$(ps -o rss= -o vsz= -p "$app_pid" | awk 'NF >= 2 { print $1 "," $2 }')
            if [ -n "$memory_values" ]; then
              printf '%s,%s\n' "$elapsed_seconds" "$memory_values" \
                | tee -a "$DIAG_DIR/memory.csv"
            fi

            sleep 10
            elapsed_seconds=$((elapsed_seconds + 10))
          done

          if kill -0 "$app_pid" 2>/dev/null; then
            vmmap -summary "$app_pid" > "$DIAG_DIR/vmmap-end.txt" 2>&1 || true
            footprint -p "$app_pid" > "$DIAG_DIR/footprint-end.txt" 2>&1 || true
            heap -s "$app_pid" > "$DIAG_DIR/heap.txt" 2>&1 || true
            leaks "$app_pid" > "$DIAG_DIR/leaks.txt" 2>&1 || true
            sample "$app_pid" 5 -file "$DIAG_DIR/sample.txt" >/dev/null 2>&1 || true

            if [ "$DIAG_MALLOC_STACKS" = "true" ]; then
              malloc_history "$app_pid" -all_by_size \
                > "$DIAG_DIR/malloc-history.txt" 2>&1 || true
              gzip -f "$DIAG_DIR/malloc-history.txt" || true
            fi
          fi

          start_rss=$(awk -F, 'NR == 2 { print $2 }' "$DIAG_DIR/memory.csv")
          end_rss=$(awk -F, 'NR > 1 { value = $2 } END { print value }' "$DIAG_DIR/memory.csv")
          sample_count=$(awk 'END { print NR - 1 }' "$DIAG_DIR/memory.csv")
          {
            echo "## macOS paused memory diagnostic"
            echo
            echo "- Samples: $sample_count"
            echo "- Initial RSS: ${start_rss:-unavailable} KB"
            echo "- Final RSS: ${end_rss:-unavailable} KB"
            if [ -n "${start_rss:-}" ] && [ -n "${end_rss:-}" ]; then
              awk -v start="$start_rss" -v end="$end_rss" \
                -v minutes="$DIAG_DURATION_MINUTES" \
                'BEGIN {
                  delta = end - start
                  printf "- RSS change: %d KB (%.2f MB/min)\\n", delta,
                    delta / 1024.0 / minutes
                }'
            fi
            echo
            echo "Download the macos-memory-diagnostic artifact for vmmap,"
            echo "heap, leaks, Objective-C runtime, and malloc-history details."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Package diagnostic app
        if: always()
        run: |
          APP_PATH="build/macos-debug/src/AltirraSDL/AltirraSDL.app"
          if [ -d "$APP_PATH" ]; then
            PACKAGE_DIR="$RUNNER_TEMP/AltirraSDL-macos-memory-diagnostic"
            mkdir -p "$PACKAGE_DIR"
            ditto "$APP_PATH" "$PACKAGE_DIR/AltirraSDL.app"
            cp run-macos-memory-diagnostic.sh MAC_OS_LEAK_DEBUG.md "$PACKAGE_DIR/"
            chmod +x "$PACKAGE_DIR/run-macos-memory-diagnostic.sh"
            ditto -c -k --keepParent "$PACKAGE_DIR" \
              "$RUNNER_TEMP/AltirraSDL-macos-memory-diagnostic.zip"
          fi

      - name: Replace diagnostic prerelease asset
        if: ${{ inputs.publish_release && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload memory-diagnostic-bad4452f \
            "$RUNNER_TEMP/AltirraSDL-macos-memory-diagnostic.zip" \
            --clobber
          gh release edit memory-diagnostic-bad4452f \
            --prerelease \
            --notes "$(cat <<EOF
          Diagnostic-only Apple Silicon build for the macOS memory-growth investigation.

          Instrumented source commit: $GITHUB_SHA

          The ZIP contains AltirraSDL.app, a Terminal launcher, and MAC_OS_LEAK_DEBUG.md. Run the baseline mode first; it prints a MACLEAK memory/frame report every ten seconds and saves the output to a log file. Controlled new-frames-only, no-upload, and no-present modes are also included for follow-up tests.

          This build excludes FFmpeg recording. It is not a normal release.
          EOF
          )"

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-memory-diagnostic-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/altirra-memory-diagnostic
            ${{ runner.temp }}/AltirraSDL-macos-memory-diagnostic.zip
          if-no-files-found: warn
          retention-days: 14
