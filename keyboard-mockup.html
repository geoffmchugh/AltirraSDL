<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Altirra Mobile Keyboard Mockup</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #111217;
    --panel: #191b22;
    --key: #30333d;
    --key-edge: #444854;
    --key-active: #ef6c35;
    --key-active-edge: #ff9568;
    --utility: #252832;
    --console: #563327;
    --text: #f6f3ee;
    --muted: #aaaeba;
    --gap: clamp(3px, 0.9vw, 7px);
    --radius: clamp(6px, 1.8vw, 11px);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: #090a0d;
    color: var(--text);
    font: 500 15px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }

  button { font: inherit; color: inherit; }

  .app {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-rows: minmax(92px, 1fr) auto;
    background: var(--bg);
  }

  .screen {
    position: relative;
    min-height: 0;
    overflow: hidden;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 50% 35%, rgba(34, 75, 98, .45), transparent 50%),
      linear-gradient(145deg, #121b22, #07090d 72%);
  }

  .screen::before {
    content: "";
    position: absolute;
    width: min(72vw, 720px);
    aspect-ratio: 4 / 3;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 8px;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 4px),
      linear-gradient(135deg, #233749, #111820);
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
  }

  .hint {
    z-index: 1;
    max-width: 80%;
    padding: 10px 16px;
    border-radius: 999px;
    color: var(--muted);
    background: rgba(0,0,0,.55);
    backdrop-filter: blur(8px);
    text-align: center;
    font-size: 13px;
  }

  .keyboard {
    padding: 7px max(7px, env(safe-area-inset-right))
      max(7px, env(safe-area-inset-bottom))
      max(7px, env(safe-area-inset-left));
    background: linear-gradient(#20222a, #15171d);
    border-top: 1px solid #3a3d47;
    box-shadow: 0 -12px 32px rgba(0,0,0,.35);
  }

  .toolbar {
    height: 38px;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }

  .toolbar-title { min-width: 0; flex: 1; }
  .toolbar-title strong { display: block; font-size: 14px; }
  .toolbar-title span { display: block; color: var(--muted); font-size: 11px; }

  .tool {
    min-width: 42px;
    height: 34px;
    padding: 0 11px;
    border: 1px solid var(--key-edge);
    border-radius: 9px;
    background: var(--utility);
  }

  .layout { display: grid; gap: var(--gap); }
  .page { display: grid; gap: var(--gap); }
  .page[hidden] { display: none; }
  .row { display: grid; gap: var(--gap); min-width: 0; }
  .five { grid-template-columns: repeat(5, 1fr); }
  .ten { grid-template-columns: repeat(10, 1fr); }
  .qwerty { grid-template-columns: repeat(10, 1fr); }
  /* The three letter rows use the same nominal key width.  The home row
     spends its missing tenth letter on a wide Return; the lower row spends
     its missing letters on wide Shift and Bk Sp keys. */
  .home { grid-template-columns: .1fr repeat(9, 1fr) 1.9fr; }
  .lower { grid-template-columns: 1.3fr repeat(7, 1fr) 1.7fr; }
  .typing-footer { grid-template-columns: 1fr 1fr 5fr; }
  .symbols { grid-template-columns: repeat(8, 1fr); }
  .symbols-four { grid-template-columns: repeat(4, 1fr); }
  .edit-top { grid-template-columns: repeat(5, 1fr); }
  .edit-actions { grid-template-columns: repeat(3, 1fr); }
  .edit-footer { grid-template-columns: 1.25fr 1.25fr 3.5fr 1.6fr; }
  .nav { grid-template-columns: 1.45fr 1fr 1fr 1fr 1fr; }

  .key {
    position: relative;
    min-width: 0;
    height: clamp(38px, 6.7vh, 54px);
    padding: 2px;
    border: 1px solid var(--key-edge);
    border-radius: var(--radius);
    background: linear-gradient(#383b46, var(--key));
    box-shadow: 0 2px 0 #111319, inset 0 1px rgba(255,255,255,.06);
    font-weight: 650;
    font-size: clamp(14px, 3.8vw, 20px);
    line-height: 1;
  }

  .key.small { font-size: clamp(9px, 2.25vw, 13px); letter-spacing: .015em; }
  .key.console { background: linear-gradient(#68412f, var(--console)); }
  .key.modifier, .key.nav-key { background: linear-gradient(#343844, #292c35); }
  .key.page-key { color: #ffd7c6; border-color: #84503a; }
  .key:active, .key.pressed {
    transform: translateY(2px);
    border-color: var(--key-active-edge);
    background: var(--key-active);
    box-shadow: inset 0 1px rgba(255,255,255,.16);
  }
  .key.latched {
    color: #fff;
    border-color: var(--key-active-edge);
    background: linear-gradient(#f17b49, #bd4c22);
  }

  .spacer { pointer-events: none; }
  .wide-label { font-size: clamp(10px, 2.6vw, 14px); }
  .arrow { font-size: clamp(18px, 5vw, 25px); }
  .key .main { display: block; font-size: clamp(13px, 3.4vw, 18px); }
  .key .legend {
    display: block;
    margin-top: 4px;
    color: #c5c8d0;
    font-size: clamp(7px, 1.8vw, 10px);
    font-weight: 600;
    line-height: 1.05;
  }

  .toast {
    position: fixed;
    z-index: 5;
    top: max(12px, env(safe-area-inset-top));
    left: 50%;
    max-width: calc(100% - 24px);
    transform: translate(-50%, -12px);
    padding: 9px 14px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 999px;
    background: rgba(18,19,24,.92);
    box-shadow: 0 8px 30px rgba(0,0,0,.4);
    opacity: 0;
    transition: .16s ease;
    pointer-events: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .landscape .app { grid-template-columns: minmax(120px, 1fr) minmax(420px, 52vw); grid-template-rows: 1fr; }
  .landscape .keyboard { border-top: 0; border-left: 1px solid #3a3d47; overflow-y: auto; }
  .landscape .key { height: clamp(36px, 7.2vh, 50px); }

  @media (max-height: 690px) and (orientation: portrait) {
    .app { grid-template-rows: minmax(70px, 1fr) auto; }
    .toolbar { height: 32px; margin-bottom: 4px; }
    .tool { height: 30px; }
    .key { height: clamp(34px, 6vh, 42px); }
  }
</style>
</head>
<body>
<main class="app">
  <section class="screen" aria-label="Emulator display preview">
    <div class="hint">Tap keys to test page switching, one-shot Shift, and touch sizing</div>
  </section>

  <section class="keyboard" aria-label="Atari mobile keyboard">
    <div class="toolbar">
      <div class="toolbar-title">
        <strong>Mobile keyboard</strong>
        <span id="pageCaption">Letters · Shift applies to the next key</span>
      </div>
      <button class="tool" id="orientation" type="button" title="Preview side placement">↻</button>
      <button class="tool" id="close" type="button" aria-label="Close keyboard">✕</button>
    </div>

    <div class="layout">
      <div class="row five">
        <button class="key console small" data-key="HELP">HELP</button>
        <button class="key console small" data-key="START">START</button>
        <button class="key console small" data-key="SELECT">SELECT</button>
        <button class="key console small" data-key="OPTION">OPTION</button>
        <button class="key console small" data-key="RESET">RESET</button>
      </div>

      <div class="page" id="lettersPage">
        <div class="row ten" id="numbers"></div>
        <div class="row qwerty" id="topLetters"></div>
        <div class="row home"><span class="spacer"></span><span id="homeLetters" style="display:contents"></span><button class="key small" data-key="RETURN">RETURN</button></div>
        <div class="row lower"><button class="key modifier small shift">SHIFT</button><span id="lowerLetters" style="display:contents"></span><button class="key small" data-key="BACKSPACE">BK SP</button></div>
        <div class="row typing-footer">
          <button class="key" data-key=".">.</button>
          <button class="key" data-key=":">:</button>
          <button class="key wide-label" data-key="SPACE">SPACE</button>
        </div>
      </div>

      <div class="page" id="symbolsPage" hidden>
        <div class="row symbols" id="symbolsOne"></div>
        <div class="row symbols" id="symbolsTwo"></div>
        <div class="row symbols" id="symbolsThree"></div>
        <div class="row symbols-four" id="symbolsFour"></div>
      </div>

      <div class="page" id="editPage" hidden>
        <div class="row edit-top">
          <button class="key small" data-key="ESC">ESC</button>
          <button class="key small" data-key="TAB">TAB</button>
          <button class="key small" data-key="CAPS">CAPS</button>
          <button class="key small" data-key="BREAK">BREAK</button>
          <button class="key" data-key="INV" aria-label="Atari inverse key">◢</button>
        </div>
        <div class="row edit-actions">
          <button class="key small" data-key="&lt;" data-shift="CLEAR">
            <span class="main">&lt;</span><span class="legend">SHIFT · CLEAR</span>
          </button>
          <button class="key small" data-key="&gt;" data-shift="INSERT LINE" data-ctrl="INSERT CHARACTER">
            <span class="main">&gt;</span><span class="legend">SHIFT · INSERT LINE<br>CTRL · INSERT CHAR</span>
          </button>
          <button class="key small" data-key="BACKSPACE" data-shift="DELETE LINE" data-ctrl="DELETE CHARACTER">
            <span class="main">BK SP</span><span class="legend">SHIFT · DELETE LINE<br>CTRL · DELETE CHAR</span>
          </button>
        </div>
        <div class="row edit-footer">
          <button class="key modifier small shift">SHIFT</button>
          <button class="key modifier small ctrl">CTRL</button>
          <button class="key wide-label" data-key="SPACE">SPACE</button>
          <button class="key small" data-key="RETURN">RETURN</button>
        </div>
      </div>

      <div class="row nav">
        <button class="key page-key small" id="pageToggle" type="button">#+=</button>
        <button class="key nav-key arrow" data-key="LEFT" aria-label="Left">←</button>
        <button class="key nav-key arrow" data-key="UP" aria-label="Up">↑</button>
        <button class="key nav-key arrow" data-key="DOWN" aria-label="Down">↓</button>
        <button class="key nav-key arrow" data-key="RIGHT" aria-label="Right">→</button>
      </div>
    </div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const makeKeys = (host, chars) => {
    for (const label of chars) {
      const key = document.createElement('button');
      key.className = 'key';
      key.type = 'button';
      key.dataset.key = label;
      key.textContent = label;
      host.appendChild(key);
    }
  };

  makeKeys($('#numbers'), '1234567890');
  makeKeys($('#topLetters'), 'QWERTYUIOP');
  makeKeys($('#homeLetters'), 'ASDFGHJKL');
  makeKeys($('#lowerLetters'), 'ZXCVBNM');

  // Characters available from the real XL/XE keyboard. The first two
  // rows are the shifted number and punctuation keys; the third keeps
  // the corresponding unshifted operators readily accessible.
  makeKeys($('#symbolsOne'), ['!', '"', '#', '$', '%', '&', "'", '@']);
  makeKeys($('#symbolsTwo'), ['(', ')', '[', ']', '?', '\\', '^', '_']);
  makeKeys($('#symbolsThree'), ['+', '*', '-', '=', '|', '/', ',', ';']);
  makeKeys($('#symbolsFour'), ['<', '>', '.', ':']);

  let shifted = false;
  let controlled = false;
  let page = 0;
  let toastTimer = 0;

  const showToast = (message) => {
    const toast = $('#toast');
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 950);
  };

  const updateShift = () => {
    document.querySelectorAll('.shift').forEach(k => {
      k.classList.toggle('latched', shifted);
      k.setAttribute('aria-pressed', String(shifted));
    });
  };

  const updateControl = () => {
    document.querySelectorAll('.ctrl').forEach(k => {
      k.classList.toggle('latched', controlled);
      k.setAttribute('aria-pressed', String(controlled));
    });
  };

  const togglePage = () => {
    page = (page + 1) % 3;
    $('#lettersPage').hidden = page !== 0;
    $('#symbolsPage').hidden = page !== 1;
    $('#editPage').hidden = page !== 2;
    $('#pageToggle').textContent = page === 0 ? '#+=' : page === 1 ? 'ATARI' : 'ABC';
    $('#pageToggle').classList.toggle('latched', page !== 0);
    $('#pageCaption').textContent = page === 0
      ? 'Letters · Shift applies to the next key'
      : page === 1
        ? 'Punctuation and shifted Atari characters'
        : 'Atari controls · Shift and Ctrl are one-shot';
    showToast(page === 0 ? 'Letters and numbers'
      : page === 1 ? 'Symbols' : 'Atari controls and editing');
  };

  $('#pageToggle').addEventListener('click', togglePage);

  document.addEventListener('click', (event) => {
    const key = event.target.closest('[data-key], .shift, .ctrl');
    if (!key) return;

    if (key.classList.contains('shift')) {
      shifted = !shifted;
      updateShift();
      showToast(shifted ? 'SHIFT latched for next key' : 'SHIFT released');
      return;
    }

    if (key.classList.contains('ctrl')) {
      controlled = !controlled;
      updateControl();
      showToast(controlled ? 'CTRL latched for next key' : 'CTRL released');
      return;
    }

    const label = key.dataset.key;
    let detail = controlled && key.dataset.ctrl
      ? key.dataset.ctrl : shifted && key.dataset.shift
        ? key.dataset.shift : label;
    if (['LEFT', 'RIGHT', 'UP', 'DOWN'].includes(label))
      detail += ' · Atari Control combination';
    else if (controlled && shifted && !key.dataset.ctrl && !key.dataset.shift)
      detail = 'CTRL + SHIFT + ' + label;
    else if (controlled && !key.dataset.ctrl)
      detail = 'CTRL + ' + label;
    else if (shifted && !key.dataset.shift)
      detail = 'SHIFT + ' + label;
    else if (['START', 'SELECT', 'OPTION'].includes(label))
      detail += ' · console switch';
    else if (label === 'RESET')
      detail += ' · warm reset';

    showToast(detail);
    if (shifted || controlled) {
      shifted = false;
      controlled = false;
      updateShift();
      updateControl();
    }
  });

  $('#orientation').addEventListener('click', () => {
    document.body.classList.toggle('landscape');
    showToast(document.body.classList.contains('landscape')
      ? 'Side keyboard preview' : 'Bottom keyboard preview');
  });

  $('#close').addEventListener('click', () => {
    const keyboard = $('.keyboard');
    keyboard.hidden = true;
    document.querySelector('.app').style.gridTemplateRows = '1fr';
    showToast('Keyboard closed · reload to reopen');
  });

  // Press feedback starts immediately under a finger, without waiting
  // for the synthetic click generated by a mobile browser.
  document.addEventListener('pointerdown', (event) => {
    const key = event.target.closest('.key');
    if (key) key.classList.add('pressed');
  });
  for (const type of ['pointerup', 'pointercancel', 'pointerout']) {
    document.addEventListener(type, (event) => {
      const key = event.target.closest('.key');
      if (key) key.classList.remove('pressed');
    });
  }
})();
</script>
</body>
</html>
